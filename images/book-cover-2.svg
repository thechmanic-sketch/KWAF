<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="240" fill="#0D0500"/>
  <rect x="0" y="0" width="8" height="240" fill="url(#sg2)"/>
  <defs>
    <linearGradient id="sg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C3D08"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#5C3D08"/>
    </linearGradient>
  </defs>
  <!-- Large hexagonal African shield -->
  <polygon points="80,15 125,42 125,95 80,122 35,95 35,42" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <polygon points="80,28 112,46 112,88 80,106 48,88 48,46" fill="#C8860A" opacity="0.1"/>
  <polygon points="80,28 112,46 112,88 80,106 48,88 48,46" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>
  <!-- Inner design -->
  <polygon points="80,42 100,53 100,75 80,86 60,75 60,53" fill="#C9A84C" opacity="0.08"/>
  <line x1="80" y1="28" x2="80" y2="106" stroke="#C9A84C" stroke-width="0.8" opacity="0.4"/>
  <line x1="35" y1="68" x2="125" y2="68" stroke="#C9A84C" stroke-width="0.8" opacity="0.4"/>
  <!-- Spear motifs -->
  <line x1="80" y1="10" x2="80" y2="18" stroke="#C9A84C" stroke-width="2"/>
  <polygon points="80,8 83,14 77,14" fill="#C9A84C"/>
  <!-- Power fist symbol -->
  <rect x="72" y="55" width="16" height="12" rx="2" fill="none" stroke="#C9A84C" stroke-width="1.2"/>
  <rect x="70" y="50" width="20" height="7" rx="2" fill="none" stroke="#C9A84C" stroke-width="1"/>
  <!-- Corner Zulu patterns -->
  <polygon points="14,14 26,14 20,24" fill="#C8860A" opacity="0.5"/>
  <polygon points="146,14 134,14 140,24" fill="#C8860A" opacity="0.5"/>
  <line x1="18" y1="156" x2="142" y2="156" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
  <text x="80" y="170" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#C9A84C" letter-spacing="0.5">AMANDLA</text>
  <text x="80" y="185" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#C9A84C" letter-spacing="0.5">YESIFUNDO</text>
  <line x1="18" y1="193" x2="142" y2="193" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
  <text x="80" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#8B6914" letter-spacing="2">THANDI MKHIZE</text>
  <text x="80" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#5C3D08" letter-spacing="1.5">KWAF</text>
</svg>
