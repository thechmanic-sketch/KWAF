<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="120" fill="none"/>
  <!-- Outer border -->
  <rect x="0" y="0" width="120" height="14" fill="#C9A84C" opacity="0.9"/>
  <rect x="0" y="106" width="120" height="14" fill="#C9A84C" opacity="0.9"/>
  <rect x="0" y="0" width="14" height="120" fill="#C9A84C" opacity="0.9"/>
  <rect x="106" y="0" width="14" height="120" fill="#C9A84C" opacity="0.9"/>
  <!-- Inner border -->
  <rect x="18" y="18" width="84" height="84" fill="none" stroke="#C8860A" stroke-width="3"/>
  <!-- Center diamond -->
  <polygon points="60,24 96,60 60,96 24,60" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <polygon points="60,36 84,60 60,84 36,60" fill="#C8860A" opacity="0.2"/>
  <polygon points="60,36 84,60 60,84 36,60" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <!-- Center square -->
  <rect x="48" y="48" width="24" height="24" fill="#C9A84C" opacity="0.15"/>
  <rect x="48" y="48" width="24" height="24" fill="none" stroke="#C9A84C" stroke-width="1"/>
  <rect x="54" y="54" width="12" height="12" fill="#C8860A" opacity="0.4"/>
  <!-- Corner triangles -->
  <polygon points="0,0 14,0 0,14" fill="#8B6914"/>
  <polygon points="120,0 106,0 120,14" fill="#8B6914"/>
  <polygon points="0,120 14,120 0,106" fill="#8B6914"/>
  <polygon points="120,120 106,120 120,106" fill="#8B6914"/>
